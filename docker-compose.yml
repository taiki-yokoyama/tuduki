services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tuduki}
      MYSQL_USER: ${MYSQL_USER:-tuduki}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tuduki}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/backend
    environment:
      APP_NAME: ${APP_NAME:-Tuduki}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:change-me-after-installation}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8081}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-tuduki}
      DB_USERNAME: ${MYSQL_USER:-tuduki}
      DB_PASSWORD: ${MYSQL_PASSWORD:-tuduki}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:5173,127.0.0.1:5173}
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor_v2:/var/www/backend/vendor
      - backend_storage:/var/www/backend/storage
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "php artisan migrate --force && php-fpm -F"

  web:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8081/api}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mysql_data:
  backend_vendor_v2:
  backend_storage:
  frontend_node_modules:
